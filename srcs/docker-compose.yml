services:
  mariadb:
    build: ./requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$(cat /run/secrets/db_password)"
          mariadb --protocol=tcp -h 127.0.0.1
          -u "$$MYSQL_USER" --database="$$MYSQL_DATABASE"
          -e "SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    image: wordpress:inception
    restart: unless-stopped
    depends_on:
       mariadb:
          condition: service_healthy
    environment:
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_HOST: mariadb
      WP_URL: https://${DOMAIN_NAME}
      WP_TITLE: Inception
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_NORMAL_USER: ${WP_NORMAL_USER}
    secrets:
      - db_password
      - wp_admin_password
      - wp_normal_password
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

  nginx:
    build: ./requirements/nginx
    container_name: nginx
    image: nginx:inception
    restart: unless-stopped
    depends_on:
       - wordpress
    ports:
      - "443:443"
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception

networks:
  inception:

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mel-houa/data/mariadb
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/mel-houa/data/wordpress

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_normal_password:
    file: ../secrets/wp_user_password.txt
